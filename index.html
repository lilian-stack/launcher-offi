<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Actoris - Launcher de jeux moderne et performant" />
    <!-- Content Security Policy améliorée pour Electron -->
    <!-- Note: 'unsafe-eval' est nécessaire pour Vite HMR en développement -->
    <!-- En production, cette CSP sera remplacée par une version plus stricte si nécessaire -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self' https://*.steamstatic.com https://*.steamusercontent.com https://*.akamai.steamstatic.com https://video.akamai.steamstatic.com https://cdn.akamai.steamstatic.com https://steamcdn-a.akamaihd.net https://*.youtube.com https://*.youtube-nocookie.com https://*.vimeo.com; frame-src https://*.youtube.com https://*.youtube-nocookie.com; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* wss://127.0.0.1:* https:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" />
    <title>Actoris</title>
    <!-- Preconnect pour améliorer les performances réseau (critique pour FCP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.discordapp.com" />
    <link rel="preconnect" href="https://steamcdn-a.akamaihd.net" />
    <!-- DNS prefetch pour les ressources externes -->
    <link rel="dns-prefetch" href="https://fpxcefuqwvwdduzkmkrj.supabase.co" />
    <!-- Preload Largest Contentful Paint image (LCP) - CRITIQUE pour le score -->
    <link rel="preload" as="image" href="/actoris-logo.png" fetchpriority="high" type="image/png" />
    <!-- Note: Le CSS est déjà chargé via import dans main.jsx, pas besoin de preload -->
    <!-- Critical CSS inline pour améliorer FCP -->
    <style>
      /* Critical CSS - Styles essentiels pour le rendu initial */
      *{margin:0;padding:0;box-sizing:border-box}
      body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f14;color:#f8fafc;overflow:hidden}
      #root{width:100vw;height:100vh;position:relative}
      /* Loading state */
      .loading-spinner{width:48px;height:48px;border:4px solid rgba(6,182,212,0.2);border-top-color:#06b6d4;border-radius:50%;animation:spin 0.8s linear infinite;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
      @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
    </style>
    <!-- Optimisation du chargement -->
    <script>
      // Définir dragEvent globalement dès le début pour éviter l'erreur "dragEvent is not defined"
      try {
        if (typeof window !== 'undefined') {
          window.dragEvent = window.dragEvent || function(e) {
            if (e && typeof e.preventDefault === 'function') {
              e.preventDefault()
            }
            if (e && typeof e.stopPropagation === 'function') {
              e.stopPropagation()
            }
          }
        }
      } catch (e) {
        // Ignorer les erreurs pendant l'initialisation
      }
      
      // Gestionnaire d'erreur global simplifié (logs désactivés)
      window.addEventListener('error', (event) => {
        // Ignorer silencieusement l'erreur "dragEvent is not defined" si elle se produit encore
        if (event.message && event.message.includes('dragEvent is not defined')) {
          event.preventDefault()
          return true
        }
        // Logs désactivés pour les autres erreurs
      }, true)
      
      // Optimisation: charger les ressources critiques en priorité
      if ('requestIdleCallback' in window) {
        requestIdleCallback(() => {
          // Précharger les ressources non critiques en arrière-plan
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Écouter les erreurs de promesses non gérées (logs désactivés)
      window.addEventListener('unhandledrejection', (event) => {
        // Logs désactivés
      })
    </script>
    <!-- Charger le script principal avec defer pour ne pas bloquer le rendu -->
    <script type="module" src="/src/main.jsx" defer></script>
    <!-- Resource hints pour améliorer le chargement -->
    <link rel="modulepreload" href="/src/main.jsx" />
  </body>
</html>
